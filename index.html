<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Party</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2129;
    --border: #2c303a;
    --text: #e7e9ee;
    --muted: #8b8f9a;
    --accent: #6c8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* --- Login screen --- */
  #login-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 300px;
  }
  #login-box h1 { font-size: 18px; margin: 0 0 16px; }
  #login-box input {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #12141a;
    color: var(--text);
  }
  #login-box button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  #login-error { color: #ff6b6b; font-size: 13px; margin-top: 8px; min-height: 16px; }

  /* --- Chat screen --- */
  #app { display: none; flex: 1; flex-direction: column; min-height: 0; }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 600; }
  header .actions button {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 6px 10px;
    margin-left: 8px;
    cursor: pointer;
    font-size: 12px;
  }
  header .actions button:hover { color: var(--text); border-color: var(--accent); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; }
  .msg .who { font-size: 12px; font-weight: 700; margin-bottom: 3px; opacity: 0.8; }
  .msg.dm { align-self: flex-end; background: var(--accent); color: white; }
  .msg.pc { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; background: none; }

  #composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  #dm-input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    resize: none;
    font-family: inherit;
  }
  #send-btn {
    padding: 0 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.5; cursor: default; }

  #state-panel {
    display: none;
    position: fixed;
    right: 16px;
    top: 60px;
    width: 320px;
    max-height: 70vh;
    overflow: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 12px;
    white-space: pre-wrap;
  }

  /* A fixed color per PC name so voices stay visually distinct */
  .pc-color-0 { border-left: 3px solid #6c8cff; }
  .pc-color-1 { border-left: 3px solid #ff9f6c; }
  .pc-color-2 { border-left: 3px solid #6cffb0; }
  .pc-color-3 { border-left: 3px solid #ff6cd9; }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h1>Sign in</h1>
    <input id="email" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="login-btn">Sign in</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>AI Party</h1>
    <div class="actions">
      <button id="state-btn">State</button>
      <button id="update-btn">Force Update</button>
      <button id="signout-btn">Sign out</button>
    </div>
  </header>
  <div id="log"></div>
  <div id="composer">
    <textarea id="dm-input" rows="1" placeholder="Narrate as the DM..."></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<div id="state-panel"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
  } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
  import {
    getFunctions, httpsCallable,
  } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-functions.js";

  // --- Fill these in from Firebase Console -> Project settings -> General
  // -> "Your apps" -> add a Web app (</>) if you haven't yet, then copy
  // the config object it shows you. ---
  const firebaseConfig = {
    apiKey: "AIzaSyDiLQ_cE49JJxwc9hXsRvMHmu-0kDWd2uM",
    authDomain: "ttrpg-console.firebaseapp.com",
    projectId: "ttrpg-console",
    storageBucket: "ttrpg-console.firebasestorage.app",
    messagingSenderId: "1035060733345",
    appId: "1:1035060733345:web:2375eefbae78f0085517e0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  // Change the region argument below if you deployed functions somewhere
  // other than the default (us-central1).
  const functions = getFunctions(app);

  const playTurn = httpsCallable(functions, "play_turn");
  const forceUpdate = httpsCallable(functions, "force_update");
  const getState = httpsCallable(functions, "get_state");

  const loginScreen = document.getElementById("login-screen");
  const appScreen = document.getElementById("app");
  const logEl = document.getElementById("log");
  const input = document.getElementById("dm-input");
  const sendBtn = document.getElementById("send-btn");
  const statePanel = document.getElementById("state-panel");

  const pcColorIndex = new Map();
  function colorClassFor(name) {
    if (!pcColorIndex.has(name)) pcColorIndex.set(name, pcColorIndex.size % 4);
    return `pc-color-${pcColorIndex.get(name)}`;
  }

  function addMessage(who, text, kind) {
    const div = document.createElement("div");
    div.className = `msg ${kind}` + (kind === "pc" ? " " + colorClassFor(who) : "");
    if (kind !== "system") {
      const whoEl = document.createElement("div");
      whoEl.className = "who";
      whoEl.textContent = who;
      div.appendChild(whoEl);
    }
    const textEl = document.createElement("div");
    textEl.textContent = text;
    div.appendChild(textEl);
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function renderHistory(log) {
    logEl.innerHTML = "";
    for (const entry of log) {
      addMessage(entry.speaker, entry.text, entry.speaker === "DM" ? "dm" : "pc");
    }
  }

  async function loadHistory() {
    try {
      const res = await getState({});
      renderHistory(res.data.log || []);
    } catch (err) {
      addMessage("", "Couldn't load history: " + err.message, "system");
    }
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendBtn.disabled = true;
    addMessage("DM", text, "dm");
    try {
      const res = await playTurn({ dm_text: text });
      for (const reply of res.data.replies) {
        addMessage(reply.name, reply.text, "pc");
      }
    } catch (err) {
      addMessage("", "Error: " + err.message, "system");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  document.getElementById("update-btn").addEventListener("click", async () => {
    addMessage("", "Syncing state...", "system");
    await forceUpdate({});
    addMessage("", "State updated.", "system");
  });

  document.getElementById("state-btn").addEventListener("click", async () => {
    if (statePanel.style.display === "block") {
      statePanel.style.display = "none";
      return;
    }
    const res = await getState({});
    statePanel.textContent = JSON.stringify(res.data.state, null, 2);
    statePanel.style.display = "block";
  });

  document.getElementById("signout-btn").addEventListener("click", () => signOut(auth));

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("login-error");
    errorEl.textContent = "";
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });

  // Firebase Auth persists the session in the browser automatically —
  // this fires on load too, so a returning device stays signed in
  // without re-entering a password, the same way claude.ai does.
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.style.display = "none";
      appScreen.style.display = "flex";
      loadHistory();
    } else {
      loginScreen.style.display = "flex";
      appScreen.style.display = "none";
    }
  });
</script>
</body>
</html>
